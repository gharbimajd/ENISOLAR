<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" color="success"></ion-back-button>
    </ion-buttons>
    <ion-title>Mission Data</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  
  <div *ngIf="!mission()" class="loading-container">
    <ion-spinner color="success"></ion-spinner>
    <p>Fetching mission details...</p>
  </div>

  <ng-container *ngIf="mission()">
    
    <div class="mission-info-header">
      <h1 class="mission-name">{{ mission().name }}</h1>
      <p class="mission-meta">Generated CSV Flight Path</p>
    </div>

    <div class="glass-panel csv-container">
      <div class="csv-header">
        <span class="file-name">flight_path.csv</span>
        <ion-button fill="clear" size="small" class="copy-btn" (click)="copyToClipboard()" [disabled]="!mission()?.flightPath">
          <ion-icon slot="icon-only" name="copy-outline"></ion-icon>
        </ion-button>
      </div>
      
      <div class="csv-content">
        <pre><code>{{ csvDisplay() }}</code></pre>
      </div>
    </div>

    <div class="glass-panel uplink-container">
      
      <div class="uplink-header">
        <h3>Drone Uplink</h3>
        <ion-badge [color]="isConnected ? 'success' : 'medium'">
          {{ isConnected ? 'LINKED' : 'OFFLINE' }}
        </ion-badge>
      </div>

      <div class="status-box">
        > {{ statusMessage }}
      </div>

      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="6" class="ion-padding-end">
            <ion-button expand="block" (click)="scanAndConnect()" [disabled]="isConnected" shape="round" color="primary">
              <ion-icon slot="start" name="bluetooth-outline"></ion-icon>
              Connect
            </ion-button>
          </ion-col>

          <ion-col size="6" class="ion-padding-start">
            <ion-button expand="block" color="success" (click)="uploadMission()" [disabled]="!isConnected || !mission()?.flightPath?.length" shape="round">
              <ion-icon slot="start" name="cloud-upload-outline"></ion-icon>
              Upload
            </ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
    </div>

    <div class="helper-text">
      <ion-icon name="information-circle-outline"></ion-icon>
      <span>Ensure the drone is powered on and in range.</span>
    </div>

  </ng-container>

</ion-content>
