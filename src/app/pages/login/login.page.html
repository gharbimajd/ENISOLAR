<ion-header>
  <ion-toolbar color="primary">
    <ion-title>ENISOLAR</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-section">
      <ion-icon name="sunny" class="logo-icon"></ion-icon>
      <h1>ENISOLAR</h1>
      <p class="subtitle">Planification de Mission Drone</p>
    </div>

    <form (ngSubmit)="onLogin()" class="login-form">
      <ion-item>
        <ion-label position="floating">Email</ion-label>
        <ion-input
          type="email"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
        ></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Mot de passe</ion-label>
        <ion-input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
        ></ion-input>
      </ion-item>

      <ion-text color="danger" *ngIf="errorMessage">
        <p class="error-message">{{ errorMessage }}</p>
      </ion-text>

      <ion-button
        expand="block"
        type="submit"
        [disabled]="isLoading"
        class="login-button"
      >
        <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
        <span *ngIf="!isLoading">Se connecter</span>
      </ion-button>

      <ion-button
        expand="block"
        fill="outline"
        (click)="continueAsGuest()"
        class="guest-button"
      >
        Continuer sans compte
      </ion-button>
    </form>

    <div class="footer">
      <p>Inspection de Panneaux Photovoltaïques</p>
    </div>
  </div>
</ion-content>
