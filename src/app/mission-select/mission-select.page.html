<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Select Pattern</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="page-header">
    <p class="subtitle">Choose a flight pattern for your drone</p>
  </div>

  <ion-grid class="ion-no-padding mission-grid">
    <ion-row>
      <ion-col size="12" class="ion-padding-bottom">
        <div class="glass-card option-card" (click)="selectMission('matrix')">
          <div class="icon-wrapper">
            <ion-icon name="grid-outline"></ion-icon>
          </div>
          <div class="card-text">
            <h3>Matrix</h3>
            <p>Crossed double-grid for 3D modeling.</p>
          </div>
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12" class="ion-padding-bottom">
        <div class="glass-card option-card" (click)="selectMission('linear')">
          <div class="icon-wrapper">
            <ion-icon name="pulse-outline"></ion-icon>
          </div>
          <div class="card-text">
            <h3>Linear</h3>
            <p>Corridor mapping for roads & pipes.</p>
          </div>
        </div>
      </ion-col>
    </ion-row>

    <ion-row>
      <ion-col size="12">
        <div class="glass-card option-card" (click)="selectMission('waypoint')">
          <div class="icon-wrapper">
            <ion-icon name="location-outline"></ion-icon>
          </div>
          <div class="card-text">
            <h3>Waypoint</h3>
            <p>Custom point-to-point flight path.</p>
          </div>
        </div>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
