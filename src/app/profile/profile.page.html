<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
<ion-title color="dark" style="color: #ffffff !important; font-weight: 500; letter-spacing: 1px; text-transform: none !important;">My Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <ion-card>
    <ion-card-header>
      <ion-card-title>Account Details</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list lines="full">
        
        <ion-item>
          <ion-icon slot="start" name="person-circle-outline" color="primary"></ion-icon>
          <ion-label>
            <h3>Username</h3>
            <p>{{ userData.full_name ? userData.full_name : 'Loading...' }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon slot="start" name="mail-outline" color="primary"></ion-icon>
          <ion-label>
            <h3>Email</h3>
            <p>{{ userData.email ? userData.email : 'Loading...' }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon slot="start" name="calendar-outline" color="primary"></ion-icon>
          <ion-label>
            <h3>Member Since</h3>
            <p>{{ userData.created_at ? (userData.created_at | date:'mediumDate') : 'Loading...' }}</p>
          </ion-label>
        </ion-item>

      </ion-list>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Change Password</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      
      <ion-item>
        <ion-icon slot="start" name="lock-closed-outline" color="medium"></ion-icon>
        <ion-input 
          type="password" 
          label="Current Password" 
          labelPlacement="floating" 
          [(ngModel)]="passwordData.currentPassword">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="key-outline" color="medium"></ion-icon>
        <ion-input 
          type="password" 
          label="New Password" 
          labelPlacement="floating" 
          [(ngModel)]="passwordData.newPassword">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="key-outline" color="medium"></ion-icon>
        <ion-input 
          type="password" 
          label="Confirm New Password" 
          labelPlacement="floating" 
          [(ngModel)]="passwordData.confirmPassword">
        </ion-input>
      </ion-item>

      <ion-button 
        expand="block" 
        class="ion-margin-top" 
        (click)="changePassword()" 
        [disabled]="!passwordData.currentPassword || !passwordData.newPassword || !passwordData.confirmPassword">
        Update Password
      </ion-button>
      
    </ion-card-content>
  </ion-card>

</ion-content>
