<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>My Profile</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="logout()" class="logout-btn">
        <ion-icon slot="icon-only" name="log-out-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="profile-scroll-container">
    
   <ion-card class="glass-card">
  <ion-card-header>
    <ion-card-title>Account Details</ion-card-title>
  </ion-card-header>
  
  <ion-item lines="none">
    <ion-icon slot="start" name="person-circle-outline"></ion-icon>
    <ion-label>
      <h3>Username</h3>
      <p>{{ userData.full_name || 'Loading...' }}</p>
    </ion-label>
  </ion-item>

  <ion-item lines="none">
    <ion-icon slot="start" name="mail-outline"></ion-icon>
    <ion-label>
      <h3>Email</h3>
      <p>{{ userData.email || 'Loading...' }}</p>
    </ion-label>
  </ion-item>

  <ion-item lines="none">
    <ion-icon slot="start" name="calendar-outline"></ion-icon>
    <ion-label>
      <h3>Member Since</h3>
      <p>{{ userData.created_at ? (userData.created_at | date:'mediumDate') : 'Loading...' }}</p>
    </ion-label>
  </ion-item>
</ion-card>

    <ion-card class="glass-card">
      <ion-card-header>
        <ion-card-title>Security</ion-card-title>
      </ion-card-header>
      
      <ion-item>
        <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
        <ion-input 
          type="password" 
          label="Current Password" 
          labelPlacement="stacked" 
          [(ngModel)]="passwordData.currentPassword"
          placeholder="••••••••">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="key-outline"></ion-icon>
        <ion-input 
          type="password" 
          label="New Password" 
          labelPlacement="stacked" 
          [(ngModel)]="passwordData.newPassword"
          placeholder="Min. 8 characters">
        </ion-input>
      </ion-item>

      <ion-item>
        <ion-icon slot="start" name="key-outline"></ion-icon>
        <ion-input 
          type="password" 
          label="Confirm New Password" 
          labelPlacement="stacked" 
          [(ngModel)]="passwordData.confirmPassword"
          placeholder="Repeat new password">
        </ion-input>
      </ion-item>

      <div class="button-container">
        <ion-button 
          expand="block" 
          (click)="changePassword()" 
          [disabled]="!passwordData.currentPassword || !passwordData.newPassword || !passwordData.confirmPassword">
          Update Password
        </ion-button>
      </div>
    </ion-card>

  </div>
</ion-content>
