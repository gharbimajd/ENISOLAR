<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-menu-button class="custom-menu-btn" auto-hide="false"></ion-menu-button>
    </ion-buttons>
    <ion-title>Inspection</ion-title>
  </ion-toolbar>

  <ion-toolbar>
    <ion-searchbar 
      class="custom-search" 
      placeholder="Search missions..." 
      [debounce]="250" 
      (ionInput)="onSearch($event)">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="content-wrapper">
    <ion-grid class="mission-grid" *ngIf="filteredMissions().length > 0">
      <ion-row>
        <ion-col size="12" size-md="6" size-lg="4" *ngFor="let mission of filteredMissions()">
          <ion-card class="mission-card glass-card" button="true" (click)="viewMissionStatus(mission, $event)">
            
            <div class="card-header-compact">
              <div class="status-indicator" [attr.data-status]="mission.status.toLowerCase()">
                {{ mission.status }}
              </div>
              <button class="delete-btn-mini" (click)="deleteMission(mission, $event)">
                <ion-icon name="trash-outline"></ion-icon>
              </button>
            </div>

            <div class="title-section">
              <h3>{{ mission.name }}</h3>
              <p class="date">{{ formatDate(mission.date) }}</p>
            </div>

            <div class="mission-stats">
              <div class="stat-row">
                <div class="stat">
                  <ion-icon name="resize-outline"></ion-icon>
                  <span>{{ mission.areaSize }}ha</span>
                </div>
                <div class="stat">
                  <ion-icon name="time-outline"></ion-icon>
                  <span>{{ formatTime(mission.estimatedTime) }}</span>
                </div>
              </div>
              <div class="stat-row">
                <div class="stat">
                  <ion-icon name="navigate-outline"></ion-icon>
                  <span>{{ mission.waypointCount }}pts</span>
                </div>
                <div class="stat">
                  <ion-icon name="eye-outline"></ion-icon>
                  <span>{{ mission.gsd }}cm</span>
                </div>
              </div>
            </div>
          </ion-card> 
        </ion-col>          
      </ion-row>
    </ion-grid>

    <div class="empty-state" *ngIf="missions().length > 0 && filteredMissions().length === 0">
      <ion-icon name="search-outline" size="large"></ion-icon>
      <h2>No results found</h2>
    </div>

    <div class="empty-state" *ngIf="missions().length === 0">
      <div class="empty-icon">
        <ion-icon name="cloud-upload-outline"></ion-icon>
      </div>
      <h2>No Missions Created</h2>
      <p>Tap the + button to start</p>
    </div>
  </div>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="createNewMission()" class="custom-fab">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
