<ion-content class="login-bg" [scrollY]="false">
  <div class="login-container">
    
    <form *ngIf="currentStep === 'email'" [formGroup]="emailForm" (ngSubmit)="sendResetOtp()" class="login-form">
      <h2>Forgot Password</h2>
      <p class="subtitle">Enter your email and we'll send you a 6-digit code to reset your password.</p>
      
      <div class="input-group" [class.invalid-group]="emailForm.get('email')?.invalid && emailForm.get('email')?.touched">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" formControlName="email" placeholder="Enter your email" />
      </div>

      <button type="submit" [disabled]="isLoading || emailForm.invalid" class="login-btn">
        <span *ngIf="!isLoading">Send verification code</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="register-section">
  <button type="button" class="register-btn" (click)="goToLogin()">
    <ion-icon name="arrow-back-outline"></ion-icon> Back to Login
  </button>
</div>
    </form>

    <form *ngIf="currentStep === 'otp'" [formGroup]="otpForm" (ngSubmit)="verifyOtp()" class="login-form">
      <h2>Verify Code</h2>
      <p class="subtitle">Enter the 6-digit code we sent to <br><strong>{{ emailForm.value.email }}</strong></p>
      
      <div class="input-group" [class.invalid-group]="otpForm.get('otp')?.invalid && otpForm.get('otp')?.touched">
        <ion-icon name="keypad-outline"></ion-icon>
        <input type="text" formControlName="otp" placeholder="Enter 6-digit OTP" maxlength="6" />
      </div>

      <button type="submit" [disabled]="isLoading || otpForm.invalid" class="login-btn">
        <span>Verify OTP</span>
      </button>

      <div class="register-section">
        <button type="button" class="register-btn" (click)="restartProcess()">
          <ion-icon name="arrow-back-outline"></ion-icon> Use Different Email
        </button>
      </div>
    </form>

    <form *ngIf="currentStep === 'reset'" [formGroup]="resetForm" (ngSubmit)="submitReset()" class="login-form">
      <h2>New Password</h2>
      <p class="subtitle">Secure your account with a brand new password.</p>

      <div class="input-group" [class.invalid-group]="resetForm.get('new_password')?.invalid && resetForm.get('new_password')?.touched">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" formControlName="new_password" placeholder="New Password" />
      </div>

      <div class="input-group" [class.invalid-group]="resetForm.errors?.['mismatch'] && resetForm.get('confirm_password')?.touched">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" formControlName="confirm_password" placeholder="Confirm New Password" />
      </div>

      <div class="error-message" *ngIf="resetForm.errors?.['mismatch'] && resetForm.get('confirm_password')?.touched">
        <ion-icon name="alert-circle-outline"></ion-icon>
        <span>Passwords don't match!</span>
      </div>

      <button type="submit" [disabled]="isLoading || resetForm.invalid" class="login-btn">
        <span *ngIf="!isLoading">Save & Login</span>
        <span *ngIf="isLoading" class="spinner"></span>
      </button>

      <div class="register-section">
        <button type="button" class="register-btn" (click)="restartProcess()">
          <ion-icon name="arrow-back-outline"></ion-icon> Cancel
        </button>
      </div>
    </form>

  </div>
</ion-content>
