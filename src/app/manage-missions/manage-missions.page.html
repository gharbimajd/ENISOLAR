<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Manage Missions</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list lines="full">
    <ion-list-header color="light">
      <ion-grid class="ion-no-padding">
        <ion-row>
          <ion-col size="7"><strong>Name</strong></ion-col>
          <ion-col size="5"><strong>Status</strong></ion-col>
        </ion-row>
      </ion-grid>
    </ion-list-header>

    <ion-item *ngFor="let mission of missions" button (click)="goToEdit(mission)" detail="true">
      <ion-grid class="ion-no-padding">
        <ion-row class="ion-align-items-center">
          <ion-col size="7">
            <ion-text class="mission-name">{{ mission.name }}</ion-text>
          </ion-col>
          <ion-col size="5">
            <ion-badge [color]="getStatusColor(mission.status)">
              {{ mission.status | uppercase }}
            </ion-badge>
          </ion-col>
        </ion-row>
      </ion-grid>
    </ion-item>
  </ion-list>

  <div *ngIf="missions.length === 0" class="ion-padding ion-text-center">
    <ion-text color="medium"><p>No missions found.</p></ion-text>
  </div>
</ion-content>
